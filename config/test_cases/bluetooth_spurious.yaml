test_name: "Bluetooth Spurious Emission Test"
description: "BLE spurious emission measurement per regulatory requirements"

test:
  channel: 39
  screenshots_folder: "C:/screenshots/ble"

bands:
  - name: "30MHz_1000MHz"
    start_hz: 30.0e+6
    stop_hz: 1000.0e+6
    offset_db: 1.5
    rbw_hz: 100.0e+3
    limit_dbm: -36

  - name: "1GHz_12.75GHz"
    start_hz: 1.0e+9
    stop_hz: 12.75e+9
    offset_db: 1.5
    rbw_hz: 1.0e+6
    limit_dbm: -30

  - name: "48.5MHz_72.5MHz"
    start_hz: 48.5e+6
    stop_hz: 72.5e+6
    offset_db: 1.5
    rbw_hz: 100.0e+3
    limit_dbm: -54

  - name: "76MHz_118MHz"
